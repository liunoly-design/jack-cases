name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: jack-cases-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Deploy exact commit through webhook
        env:
          DEPLOY_HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          test -n "$DEPLOY_HOOK_TOKEN"
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 2 \
            -H "X-Deploy-Token: $DEPLOY_HOOK_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"sha\":\"$DEPLOY_SHA\"}" \
            https://hook.minapp.xin/hooks/jack-cases
