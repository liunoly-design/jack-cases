name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: jack-cases-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Queue deployment through webhook
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 2 \
            -H 'Content-Type: application/json' \
            -H "X-Deploy-Token: $DEPLOY_HOOK_TOKEN" \
            --data "{\"sha\":\"$DEPLOY_SHA\"}" \
            https://hook.minapp.xin/hooks/jack-cases
      - name: Wait for the deployed commit
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error https://jack-cases.minapp.xin/api/health | grep -Fq "\"commit\":\"$DEPLOY_SHA\""; then
              echo "Production is serving $DEPLOY_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for production commit $DEPLOY_SHA" >&2
          exit 1
