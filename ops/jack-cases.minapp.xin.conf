server {
    listen 80;
    listen 443 ssl http2;
    server_name jack-cases.minapp.xin;

    access_log /www/sites/jack-cases.minapp.xin/log/access.log main;
    error_log /www/sites/jack-cases.minapp.xin/log/error.log;

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    ssl_certificate /www/sites/jack-cases.minapp.xin/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/jack-cases.minapp.xin/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /data/jack-cases/current/apps/web/dist;
    index index.html;
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
